name: text-extraction-workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  text-extraction-workflow:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.6.2
    timeout-minutes: 90
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
          libxt6 libglpk-dev libpoppler-cpp-dev cmake poppler-data \
          libmagick++-dev
          
      - name: Trust git repo
        run: |
          git config --global --add safe.directory /__w/seypol/seypol
          
      - name: Install packages from renv.lock (with cache)
        if: ${{ !env.ACT }}  
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      - name: Install packages from renv.lock (local, no cache)
        if: ${{ env.ACT }}  
        run: |
          renv::restore()
        shell: Rscript {0}
        
      - name: Run workflow
        run: |
          targets::tar_make(sc_policy_drive_catalogue)
        shell: Rscript {0}
